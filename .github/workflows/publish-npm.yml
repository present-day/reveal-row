name: Publish to npm

# Publishing the same version twice always fails. Run only when you tag a release
# (e.g. after merging a version bump: git tag vX.Y.Z && git push origin vX.Y.Z),
# or use "Run workflow" from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    # If your Trusted Publisher on npmjs.com has an "Environment" set, un-comment and set the
    # same name. If you leave the comment below out, the npm side must have Environment empty.
    # environment: <ENV_NAME>
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test:coverage
      - run: bun run build

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC trusted-publishing support requires npm 11.5.1+; without it npm silently
      # falls back to an unauthenticated publish (fails with a 404, not a 401/403). Pinned to
      # the 11.x line rather than "latest" since npm 12 requires a newer Node than we run here.
      - run: npm install -g npm@11

      - name: Publish to npm (OIDC)
        run: npm publish --provenance --access public
